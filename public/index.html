<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8b6fd8">
<title>LYNX LIFE by Ryora — aplikasi couple berdua</title>
<meta name="description" content="LYNX LIFE — aplikasi couple buat kamu & dia: live lokasi, jadwal, keuangan bareng, habit, games, AI bestie.">
<meta property="og:title" content="🐾 LYNX LIFE by Ryora">
<meta property="og:description" content="Aplikasi couple buat kamu & dia — live lokasi, jadwal, keuangan, games, AI bestie.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#8b6fd8 0%,#6d54b8 55%,#54418f 100%);transition:opacity .45s ease,visibility .45s}
#splash.gone{opacity:0;visibility:hidden}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;animation:spin .5s ease both}
@keyframes spin{from{opacity:0;transform:scale(.94) translateY(8px)}}
.sp-mark{width:96px;height:96px;animation:spfloat 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 30px #d9ccff66)}
@keyframes spfloat{50%{transform:translateY(-8px)}}
.sp-wave{stroke-dasharray:220;stroke-dashoffset:220;animation:spdraw 1.4s ease forwards .2s}
.sp-wave2{animation-delay:.55s}
@keyframes spdraw{to{stroke-dashoffset:0}}
.sp-name{font:700 34px 'Fredoka',system-ui,sans-serif;color:#f4efff;letter-spacing:1px}
.sp-name b{background:linear-gradient(90deg,#e6dcff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-tag{font:500 14px 'Plus Jakarta Sans',system-ui,sans-serif;color:#c9bdf0}
.sp-dots{display:flex;gap:7px;margin-top:10px}
.sp-dots i{width:8px;height:8px;border-radius:50%;background:#e6dcff;animation:spdot 1.1s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s;background:#a78bfa}
.sp-dots i:nth-child(3){animation-delay:.3s}
@keyframes spdot{40%{transform:translateY(-7px);opacity:1}80%{transform:translateY(0);opacity:.35}}
</style>
</head>
<body>
<div id="splash"><div class="sp-in">
<svg class="sp-mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9ccff"/></linearGradient>
<linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7fe6"/><stop offset="1" stop-color="#6d54b8"/></linearGradient></defs>
<rect width="512" height="512" rx="110" fill="url(#sbg)"/>
<path class="sp-wave" d="M172 210 L138 96 L128 64 L144 92 L210 178 Z" fill="url(#sg)"/>
<path class="sp-wave" d="M340 210 L374 96 L384 64 L368 92 L302 178 Z" fill="url(#sg)"/>
<path d="M138 96 L118 60" stroke="url(#sg)" stroke-width="14" stroke-linecap="round"/>
<path d="M374 96 L394 60" stroke="url(#sg)" stroke-width="14" stroke-linecap="round"/>
<circle cx="256" cy="286" r="128" fill="#5b479e" stroke="url(#sg)" stroke-width="10"/>
<circle cx="212" cy="270" r="17" fill="url(#sg)"/>
<circle cx="300" cy="270" r="17" fill="url(#sg)"/>
<path d="M248 308 h16 l-8 12 Z" fill="url(#sg)"/>
<path d="M256 320 q0 16 -20 18 M256 320 q0 16 20 18" stroke="url(#sg)" stroke-width="9" fill="none" stroke-linecap="round"/>
<g stroke="url(#sg)" stroke-width="8" stroke-linecap="round" opacity=".7">
<path d="M140 300 h-38"/><path d="M144 330 l-36 14"/>
<path d="M372 300 h38"/><path d="M368 330 l36 14"/></g>
</svg>
<div class="sp-name">LYNX <b>LIFE</b></div>
<div class="sp-tag">by Ryora · buat kamu &amp; dia 💙</div>
<div class="sp-dots"><i></i><i></i><i></i></div>
</div></div>
<div id="app"></div>
<div id="missOverlay" class="hidden"><div class="hearts">❤</div><div id="missText"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="app.js"></script>
</body>
</html>
